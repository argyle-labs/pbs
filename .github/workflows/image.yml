name: Image

# Builds the PBS container image from docker/Dockerfile and publishes it to both
# registries. Upstream Proxmox ships no official PBS image, so this repo owns one
# built from Proxmox's own `pbs-no-subscription` packages — the provenance stays
# first-party and no third-party image enters the supply chain.
#
# Gitea is the primary remote; GitHub is the mirror. Registry coordinates come
# from the ORG-level `CI_REGISTRY` var + `CI_REGISTRY_USER`/`CI_REGISTRY_TOKEN`
# secrets that every argyle-labs repo already shares; ghcr uses `GH_TOKEN`
# (on a Gitea runner the built-in token is a *Gitea* token and cannot auth to
# ghcr). Each push is gated on its credential existing, so a run degrades to the
# registry it can reach instead of failing.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (e.g. 4.2, 4.2.6, latest)"
        required: true
        type: string
        default: "4.2"
      push:
        description: "Push to registries (off = build only)"
        required: true
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - "docker/**"
      - ".github/workflows/image.yml"

env:
  IMAGE_NAME: argyle-labs/pbs
  # `inputs` is only populated for workflow_dispatch; on a push event it is
  # empty, which previously skipped both logins while still attempting a push.
  PUSH: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
  TAG: ${{ inputs.tag || '4.2' }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: ${{ env.PUSH == 'true' && secrets.GH_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Log in to Gitea registry
        if: ${{ env.PUSH == 'true' && vars.CI_REGISTRY != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.CI_REGISTRY }}
          username: ${{ secrets.CI_REGISTRY_USER }}
          password: ${{ secrets.CI_REGISTRY_TOKEN }}

      - name: Assemble tags
        id: tags
        run: |
          TAGS=""
          if [ -n "${{ secrets.GH_TOKEN }}" ]; then
            TAGS="ghcr.io/${IMAGE_NAME}:${TAG}"
          fi
          if [ -n "${{ vars.CI_REGISTRY }}" ]; then
            [ -n "$TAGS" ] && TAGS="${TAGS},"
            TAGS="${TAGS}${{ vars.CI_REGISTRY }}/${IMAGE_NAME}:${TAG}"
          fi
          if [ -z "$TAGS" ]; then
            echo "No registry credentials available — nothing to publish." >&2
            exit 1
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Publishing: ${TAGS}"

      # Build ONCE into the local daemon. Pushing is deliberately separate: a
      # single buildx invocation carrying both tags pushes atomically, so one
      # registry rejecting the token aborts the other too — which is how a ghcr
      # scope error previously stopped the image reaching Gitea at all.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: pbs:ci
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Prove PBS actually starts BEFORE publishing, so a broken image is never
      # exposed to consumers. Both daemons must come up for /ping to answer.
      # Probe from INSIDE the container. The job itself runs in a container on
      # the Gitea runner, so `-p 8007:8007` publishes on the docker HOST, not in
      # this job's network namespace — a localhost probe from here can never
      # reach it regardless of whether PBS is healthy. Exec'ing into the
      # container's own netns tests the thing we actually care about (does PBS
      # serve?) and makes no assumption about runner topology.
      - name: Smoke test
        run: |
          docker run -d --name pbs-smoke \
            --tmpfs /run/proxmox-backup:rw,nosuid,nodev,mode=0755 \
            pbs:ci
          for i in $(seq 1 60); do
            if docker exec pbs-smoke curl -fsk https://127.0.0.1:8007/api2/json/ping >/dev/null 2>&1; then
              echo "PBS answered after ~$((i*2))s"
              # Both daemons must be up with the right identities, not just one.
              docker exec pbs-smoke ps -eo user,comm | grep proxmox-backup
              docker exec pbs-smoke ps -eo user,comm | grep -q '^root .*proxmox-backup' \
                || { echo "api not running as root"; exit 1; }
              docker exec pbs-smoke ps -eo user,comm | grep -q '^backup .*proxmox-backup' \
                || { echo "proxy not running as backup"; exit 1; }
              # A missing tmpfs degrades traffic control silently — fail on it.
              if docker logs pbs-smoke 2>&1 | grep -q 'not on tmpfs'; then
                echo "traffic control degraded: /run/proxmox-backup not tmpfs"; exit 1
              fi
              docker rm -f pbs-smoke; exit 0
            fi
            sleep 2
          done
          echo "PBS never answered"; docker logs pbs-smoke; docker rm -f pbs-smoke; exit 1

      - name: Push to Gitea registry
        if: ${{ env.PUSH == 'true' && vars.CI_REGISTRY != '' }}
        run: |
          REF="${{ vars.CI_REGISTRY }}/${IMAGE_NAME}:${TAG}"
          docker tag pbs:ci "$REF"
          docker push "$REF"

      - name: Push to ghcr.io
        if: ${{ env.PUSH == 'true' && secrets.GH_TOKEN != '' }}
        run: |
          REF="ghcr.io/${IMAGE_NAME}:${TAG}"
          docker tag pbs:ci "$REF"
          docker push "$REF"
