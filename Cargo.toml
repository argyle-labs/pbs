[package]
name = "pbs"
version = "0.1.0"
edition = "2021"
description = "Proxmox Backup Server — orca service-backend for backup datastores and jobs"

[package.metadata.orca]
category = "infra"

[lib]
name = "pbs"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "pbs"
path = "src/main.rs"

# Registers a ServiceBackend and the `pbs.` tool surface over the orca socket,
# reaching orca through plugin-toolkit alone.
[dependencies]
plugin-toolkit = { git = "https://github.com/argyle-labs/orca", branch = "main" }
# The one crate outside the toolkit: a custom certificate verifier that pins
# PBS's self-signed cert by fingerprint, handed to reqwest as a preconfigured
# rustls config. Same version reqwest already links.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[dev-dependencies]
plugin-toolkit = { git = "https://github.com/argyle-labs/orca", branch = "main" }
tokio    = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
tempfile = "3"

[lints.clippy]
let_underscore_must_use = "deny"
